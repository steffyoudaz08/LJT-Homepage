# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
title: Junteng Liu
title_separator: "|"
subtitle: ""
name: Junteng Liu
description: > # this means to ignore newlines until "last_name"
  Junteng Liu's personal homepage. First-year PhD candidate at HKUST NLP Group.
email: jliugi@connect.ust.hk
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://steffyoudaz08.github.io/LJT-Homepage"
repository: steffyoudaz08/LJT-Homepage
twitter_username: junteng88716710
github_username: Vicent0205
logo: ""
lang: en

# -----------------------------------------------------------------------------
# Social settings
# -----------------------------------------------------------------------------
social:
  - icon: "fab fa-twitter"
    url: "https://twitter.com/junteng88716710"
  - icon: "fab fa-github"
    url: "https://github.com/Vicent0205"
  - icon: "ai ai-google-scholar"
    url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      show: true

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-redirect-from

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _docs/
  - _pages/about.md
  - _pages/publications.html

# -----------------------------------------------------------------------------
# Scss
# -----------------------------------------------------------------------------
scss:
  sass_dir: _sass

# -----------------------------------------------------------------------------
# Conversion
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:title/

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------
paginate: 5
paginate_path: "/blog/page:num/"

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------
analytics:
  provider: "google-gtag"
  google:
    tracking_id: ""
    anonymize_ip: false

# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------
comments:
  provider: ""
  disqus:
    shortname: ""
  giscus:
    repo_id: ""
    repo_id_before: ""
    category: ""
    category_id: ""
    location: ""
    mapping: ""
    theme: ""
    reaction_enabled: ""
    metadata: ""
    input_position: ""
    emit_metadata: ""
    lang: ""

# -----------------------------------------------------------------------------
# Fonts
# -----------------------------------------------------------------------------
fonts:
  - name: "default"
    fonts:
      - "sans-serif"
    weights:
      - 400
      - 500
      - 600
      - 700
  - name: "serif"
    fonts:
      - "serif"
    weights:
      - 400
      - 500
      - 600
      - 700
  - name: "monospace"
    fonts:
      - "monospace"
    weights:
      - 400
      - 500
      - 600
      - 700

# -----------------------------------------------------------------------------
# GitHub metadata
# -----------------------------------------------------------------------------
github:
  url: "https://github.com/steffyoudaz08/LJT-Homepage"
  children:
    - name: "Junteng Liu"
      description: "First-year PhD candidate at HKUST NLP Group"
    - name: "HKUST NLP Group"
      description: "Research group at HKUST"
    - name: "Academic Pages"
      description: "Beautiful site template"

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
theme: ""

# -----------------------------------------------------------------------------
# Site verification
# -----------------------------------------------------------------------------
google_site_verification: ""
bing_site_verification: ""
alexa_site_verification: ""
yandex_site_verification: ""

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
timezone: Asia/Hong_Kong

# -----------------------------------------------------------------------------
# separated by a space
# -----------------------------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# -----------------------------------------------------------------------------
# The 'future' key controls whether or not posts with a 'date' in the future are
# -----------------------------------------------------------------------------
future: true

# -----------------------------------------------------------------------------
# The 'unpublished' key controls whether or not published documents are included
# -----------------------------------------------------------------------------
unpublished: false

# -----------------------------------------------------------------------------
# The 'default' key controls the default extensions
# -----------------------------------------------------------------------------
default_ext: "html"

# -----------------------------------------------------------------------------
# The 'excerpt' separator
# -----------------------------------------------------------------------------
excerpt_separator: "\n\n"

# -----------------------------------------------------------------------------
# The 'port' default
# -----------------------------------------------------------------------------
port: 4000

# -----------------------------------------------------------------------------
# The 'host' default
# -----------------------------------------------------------------------------
host: 127.0.0.1

# -----------------------------------------------------------------------------
# The 'detach' key controls whether the Jekyll web server runs in the background
# -----------------------------------------------------------------------------
detach: false

# -----------------------------------------------------------------------------
# The 'ls' key controls the Jekyll web server listing directory contents
# -----------------------------------------------------------------------------
ls: false

# -----------------------------------------------------------------------------
# The 'trace' key controls the Jekyll web server tracing
# -----------------------------------------------------------------------------
trace: false

# -----------------------------------------------------------------------------
# The 'incremental' key controls the Jekyll incremental build
# -----------------------------------------------------------------------------
incremental: false

# -----------------------------------------------------------------------------
# The 'strict_front_matter' key controls the strict front matter parsing
# -----------------------------------------------------------------------------
strict_front_matter: false

# -----------------------------------------------------------------------------
# The 'livereload' key controls the Jekyll web server livereload
# -----------------------------------------------------------------------------
livereload: false

# -----------------------------------------------------------------------------
# The 'livereload_delay' key controls the Jekyll web server livereload delay
# -----------------------------------------------------------------------------
livereload_delay: 0

# -----------------------------------------------------------------------------
# The 'show_drafts' key controls the Jekyll web server showing drafts
# -----------------------------------------------------------------------------
show_drafts: false

# -----------------------------------------------------------------------------
# The 'disable_disk_cache' key controls the Jekyll web server disabling disk cache
# -----------------------------------------------------------------------------
disable_disk_cache: false

# -----------------------------------------------------------------------------
# The 'incremental' key controls the Jekyll incremental build
# -----------------------------------------------------------------------------
incremental: false

# -----------------------------------------------------------------------------
# The 'profile' key controls the Jekyll profile
# -----------------------------------------------------------------------------
profile: false
